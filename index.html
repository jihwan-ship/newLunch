<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <title>사당 점심지도</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"
    />

    <style>
      /* Layout: 왼쪽 지도 + 오른쪽 식권처럼 생긴 식당 목록, 폰에선 지도 위·목록 아래 */
      :root {
        --bg: #eef1ea;
        --card: #fbfcf8;
        --ink: #1c2420;
        --muted: #5f6b63;
        --line: #d5dbd0;
        --accent: #1f6b4c;
        --accent-ink: #ffffff;
        --pick: #f0b93a;
        --pick-ink: #2a2006;
        --open: #2f8a57;
        --closed: #b5452f;
        --unknown: #8a8f86;
        --sketch: #e3e8de;
        --road: #ffffff;
        --road-edge: #c3cbbf;
        --display:
          "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --body:
          "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121815;
          --card: #1a221e;
          --ink: #e7ece6;
          --muted: #9aa69e;
          --line: #2c3731;
          --accent: #5cc493;
          --accent-ink: #0d1a13;
          --pick: #f0b93a;
          --pick-ink: #2a2006;
          --open: #5cc493;
          --closed: #ec7a5f;
          --unknown: #8a948d;
          --sketch: #18201c;
          --road: #34413a;
          --road-edge: #26302b;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121815;
        --card: #1a221e;
        --ink: #e7ece6;
        --muted: #9aa69e;
        --line: #2c3731;
        --accent: #5cc493;
        --accent-ink: #0d1a13;
        --pick: #f0b93a;
        --pick-ink: #2a2006;
        --open: #5cc493;
        --closed: #ec7a5f;
        --unknown: #8a948d;
        --sketch: #18201c;
        --road: #34413a;
        --road-edge: #26302b;
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.5;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 14px;
        gap: 12px;
        box-sizing: border-box;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
      }
      h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 2rem;
        line-height: 1;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 4px;
      }
      .pickbtn {
        font-family: var(--display);
        font-size: 1.15rem;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        background: var(--pick);
        color: var(--pick-ink);
        cursor: pointer;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      }
      .pickbtn:active {
        transform: translateY(1px);
        box-shadow: none;
      }
      .pickbtn:focus-visible,
      .chip:focus-visible,
      .item:focus-visible,
      .mapbtn:focus-visible,
      select:focus-visible,
      label:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .chip {
        font: 500 0.85rem var(--body);
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
        margin-left: auto;
        border-radius: 6px;
      }
      .toggle input {
        accent-color: var(--accent);
      }

      .main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
        gap: 14px;
      }
      .mapbox {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        min-height: 0;
        background: var(--card);
      }
      #map {
        position: absolute;
        inset: 0;
        background: var(--line);
      }
      .tilenote {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 24px;
        z-index: 1100;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .mapbtn {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1100;
        font: 500 0.8rem var(--body);
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }
      .mapbtn[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .list {
        overflow-y: auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 2px;
      }
      .count {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
        width: 100%;
        position: relative;
      }
      .item::before,
      .item::after {
        content: "";
        position: absolute;
        right: 66px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .item::before {
        top: -7px;
      }
      .item::after {
        bottom: -7px;
      }
      .item.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent) inset;
      }
      .item.picked {
        border-color: var(--pick);
        box-shadow: 0 0 0 3px var(--pick) inset;
      }
      .dot {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-size: 0.95rem;
        color: #fff;
      }
      .name {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
      }
      .state {
        font-weight: 500;
      }
      .state.open {
        color: var(--open);
      }
      .state.closed {
        color: var(--closed);
      }
      .state.unknown {
        color: var(--unknown);
      }
      .bud {
        font-weight: 500;
        font-size: 0.75rem;
        padding: 0 7px;
        border-radius: 999px;
        border: 1px solid currentColor;
      }
      .bud.in {
        color: var(--open);
      }
      .bud.edge {
        color: var(--pick);
      }
      .bud.over {
        color: var(--closed);
      }
      .walkset {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .chip.sm {
        font-size: 0.78rem;
        padding: 3px 9px;
      }
      .walk {
        font-family: var(--display);
        font-size: 1.25rem;
        text-align: right;
        line-height: 1;
        padding-left: 14px;
        border-left: 1px dashed var(--line);
        font-variant-numeric: tabular-nums;
        min-width: 48px;
      }
      .walk small {
        display: block;
        font-family: var(--body);
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 2px;
      }

      /* 마커 */
      .pin {
        width: 28px;
        height: 28px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        border: 2px solid #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        display: grid;
        place-items: center;
      }
      .pin span {
        transform: rotate(45deg);
        color: #fff;
        font-family: var(--display);
        font-size: 0.8rem;
      }
      .pin.big {
        width: 38px;
        height: 38px;
        outline: 3px solid var(--pick);
      }
      .office {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--ink);
        color: var(--bg);
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-size: 0.85rem;
        border: 2px solid var(--pick);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }
      .pop h3 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.2rem;
        margin: 0 0 2px;
      }
      .pop p {
        margin: 2px 0;
        font-size: 0.82rem;
      }
      .pop .links {
        display: flex;
        gap: 10px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .pop a {
        color: var(--accent);
        font-weight: 700;
        font-size: 0.82rem;
      }

      @media (max-width: 760px) {
        .wrap {
          height: auto;
          min-height: 100%;
        }
        .main {
          grid-template-columns: 1fr;
        }
        .mapbox {
          height: 46vh;
          min-height: 280px;
        }
        .list {
          overflow: visible;
        }
        .toggle {
          margin-left: 0;
        }
        h1 {
          font-size: 1.7rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      /* Leaflet 1.9.4 공식 CSS 전체 */
      /* required styles */

      .leaflet-pane,
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-tile-container,
      .leaflet-pane > svg,
      .leaflet-pane > canvas,
      .leaflet-zoom-box,
      .leaflet-image-layer,
      .leaflet-layer {
        position: absolute;
        left: 0;
        top: 0;
      }
      .leaflet-container {
        overflow: hidden;
      }
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow {
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
      }
      /* Prevents IE11 from highlighting tiles in blue */
      .leaflet-tile::selection {
        background: transparent;
      }
      /* Safari renders non-retina tile on retina better with this, but Chrome is worse */
      .leaflet-safari .leaflet-tile {
        image-rendering: -webkit-optimize-contrast;
      }
      /* hack that prevents hw layers "stretching" when loading new tiles */
      .leaflet-safari .leaflet-tile-container {
        width: 1600px;
        height: 1600px;
        -webkit-transform-origin: 0 0;
      }
      .leaflet-marker-icon,
      .leaflet-marker-shadow {
        display: block;
      }
      /* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
      /* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
      .leaflet-container .leaflet-overlay-pane svg {
        max-width: none !important;
        max-height: none !important;
      }
      .leaflet-container .leaflet-marker-pane img,
      .leaflet-container .leaflet-shadow-pane img,
      .leaflet-container .leaflet-tile-pane img,
      .leaflet-container img.leaflet-image-layer,
      .leaflet-container .leaflet-tile {
        max-width: none !important;
        max-height: none !important;
        width: auto;
        padding: 0;
      }

      .leaflet-container img.leaflet-tile {
        /* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
        mix-blend-mode: plus-lighter;
      }

      .leaflet-container.leaflet-touch-zoom {
        -ms-touch-action: pan-x pan-y;
        touch-action: pan-x pan-y;
      }
      .leaflet-container.leaflet-touch-drag {
        -ms-touch-action: pinch-zoom;
        /* Fallback for FF which doesn't support pinch-zoom */
        touch-action: none;
        touch-action: pinch-zoom;
      }
      .leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
        -ms-touch-action: none;
        touch-action: none;
      }
      .leaflet-container {
        -webkit-tap-highlight-color: transparent;
      }
      .leaflet-container a {
        -webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
      }
      .leaflet-tile {
        filter: inherit;
        visibility: hidden;
      }
      .leaflet-tile-loaded {
        visibility: inherit;
      }
      .leaflet-zoom-box {
        width: 0;
        height: 0;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
        z-index: 800;
      }
      /* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
      .leaflet-overlay-pane svg {
        -moz-user-select: none;
      }

      .leaflet-pane {
        z-index: 400;
      }

      .leaflet-tile-pane {
        z-index: 200;
      }
      .leaflet-overlay-pane {
        z-index: 400;
      }
      .leaflet-shadow-pane {
        z-index: 500;
      }
      .leaflet-marker-pane {
        z-index: 600;
      }
      .leaflet-tooltip-pane {
        z-index: 650;
      }
      .leaflet-popup-pane {
        z-index: 700;
      }

      .leaflet-map-pane canvas {
        z-index: 100;
      }
      .leaflet-map-pane svg {
        z-index: 200;
      }

      .leaflet-vml-shape {
        width: 1px;
        height: 1px;
      }
      .lvml {
        behavior: none;
        display: inline-block;
        position: absolute;
      }

      /* control positioning */

      .leaflet-control {
        position: relative;
        z-index: 800;
        pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
        pointer-events: auto;
      }
      .leaflet-top,
      .leaflet-bottom {
        position: absolute;
        z-index: 1000;
        pointer-events: none;
      }
      .leaflet-top {
        top: 0;
      }
      .leaflet-right {
        right: 0;
      }
      .leaflet-bottom {
        bottom: 0;
      }
      .leaflet-left {
        left: 0;
      }
      .leaflet-control {
        float: left;
        clear: both;
      }
      .leaflet-right .leaflet-control {
        float: right;
      }
      .leaflet-top .leaflet-control {
        margin-top: 10px;
      }
      .leaflet-bottom .leaflet-control {
        margin-bottom: 10px;
      }
      .leaflet-left .leaflet-control {
        margin-left: 10px;
      }
      .leaflet-right .leaflet-control {
        margin-right: 10px;
      }

      /* zoom and fade animations */

      .leaflet-fade-anim .leaflet-popup {
        opacity: 0;
        -webkit-transition: opacity 0.2s linear;
        -moz-transition: opacity 0.2s linear;
        transition: opacity 0.2s linear;
      }
      .leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
        opacity: 1;
      }
      .leaflet-zoom-animated {
        -webkit-transform-origin: 0 0;
        -ms-transform-origin: 0 0;
        transform-origin: 0 0;
      }
      svg.leaflet-zoom-animated {
        will-change: transform;
      }

      .leaflet-zoom-anim .leaflet-zoom-animated {
        -webkit-transition: -webkit-transform 0.25s cubic-bezier(0, 0, 0.25, 1);
        -moz-transition: -moz-transform 0.25s cubic-bezier(0, 0, 0.25, 1);
        transition: transform 0.25s cubic-bezier(0, 0, 0.25, 1);
      }
      .leaflet-zoom-anim .leaflet-tile,
      .leaflet-pan-anim .leaflet-tile {
        -webkit-transition: none;
        -moz-transition: none;
        transition: none;
      }

      .leaflet-zoom-anim .leaflet-zoom-hide {
        visibility: hidden;
      }

      /* cursors */

      .leaflet-interactive {
        cursor: pointer;
      }
      .leaflet-grab {
        cursor: -webkit-grab;
        cursor: -moz-grab;
        cursor: grab;
      }
      .leaflet-crosshair,
      .leaflet-crosshair .leaflet-interactive {
        cursor: crosshair;
      }
      .leaflet-popup-pane,
      .leaflet-control {
        cursor: auto;
      }
      .leaflet-dragging .leaflet-grab,
      .leaflet-dragging .leaflet-grab .leaflet-interactive,
      .leaflet-dragging .leaflet-marker-draggable {
        cursor: move;
        cursor: -webkit-grabbing;
        cursor: -moz-grabbing;
        cursor: grabbing;
      }

      /* marker & overlays interactivity */
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-image-layer,
      .leaflet-pane > svg path,
      .leaflet-tile-container {
        pointer-events: none;
      }

      .leaflet-marker-icon.leaflet-interactive,
      .leaflet-image-layer.leaflet-interactive,
      .leaflet-pane > svg path.leaflet-interactive,
      svg.leaflet-image-layer.leaflet-interactive path {
        pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
        pointer-events: auto;
      }

      /* visual tweaks */

      .leaflet-container {
        background: #ddd;
        outline-offset: 1px;
      }
      .leaflet-container a {
        color: #0078a8;
      }
      .leaflet-zoom-box {
        border: 2px dotted #38f;
        background: rgba(255, 255, 255, 0.5);
      }

      /* general typography */
      .leaflet-container {
        font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
        font-size: 12px;
        font-size: 0.75rem;
        line-height: 1.5;
      }

      /* general toolbar styles */

      .leaflet-bar {
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.65);
        border-radius: 4px;
      }
      .leaflet-bar a {
        background-color: #fff;
        border-bottom: 1px solid #ccc;
        width: 26px;
        height: 26px;
        line-height: 26px;
        display: block;
        text-align: center;
        text-decoration: none;
        color: black;
      }
      .leaflet-bar a,
      .leaflet-control-layers-toggle {
        background-position: 50% 50%;
        background-repeat: no-repeat;
        display: block;
      }
      .leaflet-bar a:hover,
      .leaflet-bar a:focus {
        background-color: #f4f4f4;
      }
      .leaflet-bar a:first-child {
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
      }
      .leaflet-bar a:last-child {
        border-bottom-left-radius: 4px;
        border-bottom-right-radius: 4px;
        border-bottom: none;
      }
      .leaflet-bar a.leaflet-disabled {
        cursor: default;
        background-color: #f4f4f4;
        color: #bbb;
      }

      .leaflet-touch .leaflet-bar a {
        width: 30px;
        height: 30px;
        line-height: 30px;
      }
      .leaflet-touch .leaflet-bar a:first-child {
        border-top-left-radius: 2px;
        border-top-right-radius: 2px;
      }
      .leaflet-touch .leaflet-bar a:last-child {
        border-bottom-left-radius: 2px;
        border-bottom-right-radius: 2px;
      }

      /* zoom control */

      .leaflet-control-zoom-in,
      .leaflet-control-zoom-out {
        font:
          bold 18px "Lucida Console",
          Monaco,
          monospace;
        text-indent: 1px;
      }

      .leaflet-touch .leaflet-control-zoom-in,
      .leaflet-touch .leaflet-control-zoom-out {
        font-size: 22px;
      }

      /* layers control */

      .leaflet-control-layers {
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        background: #fff;
        border-radius: 5px;
      }
      .leaflet-control-layers-toggle {
        background-image: none;
        width: 36px;
        height: 36px;
      }
      .leaflet-retina .leaflet-control-layers-toggle {
        background-image: none;
        background-size: 26px 26px;
      }
      .leaflet-touch .leaflet-control-layers-toggle {
        width: 44px;
        height: 44px;
      }
      .leaflet-control-layers .leaflet-control-layers-list,
      .leaflet-control-layers-expanded .leaflet-control-layers-toggle {
        display: none;
      }
      .leaflet-control-layers-expanded .leaflet-control-layers-list {
        display: block;
        position: relative;
      }
      .leaflet-control-layers-expanded {
        padding: 6px 10px 6px 6px;
        color: #333;
        background: #fff;
      }
      .leaflet-control-layers-scrollbar {
        overflow-y: scroll;
        overflow-x: hidden;
        padding-right: 5px;
      }
      .leaflet-control-layers-selector {
        margin-top: 2px;
        position: relative;
        top: 1px;
      }
      .leaflet-control-layers label {
        display: block;

      function dist(a, b) {
        const toR = (x) => (x * Math.PI) / 180,
          Rr = 6371000;
        const dLat = toR(b.lat - a.lat),
          dLng = toR(b.lng - a.lng);
        const s =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * Rr * Math.asin(Math.sqrt(s));
      }

      const toMin = (t) => {

      function status(r, now = new Date()) {
        if (!r.h) return { k: "unknown", t: "영업시간 확인 필요" };
        const s = r.h[now.getDay()];
        if (s === "휴무") return { k: "closed", t: "오늘 휴무" };
        if (s === "24h") return { k: "open", t: "24시간 영업" };
        // "11:30-15:00,16:30-20:30" 처럼 브레이크타임 있는 경우도 처리
        const cur = now.getHours() * 60 + now.getMinutes();
        const ranges = s.split(",").map((x) => x.split("-"));
        for (const [a, b] of ranges) {
          if (cur >= toMin(a) && cur < toMin(b))
            return {
              k: "open",
              t: `영업중 · ${b > "24" ? String((toMin(b) / 60 - 24) | 0).padStart(2, "0") + b.slice(2) : b}까지`,
            };
        }
        const next = ranges.find(([a]) => cur < toMin(a));
        if (next)
          return {
            k: "closed",
            t:
              ranges[0][0] === next[0]
                ? `${next[0]} 오픈`
                : `브레이크 · ${next[0]} 재오픈`,
          };
        return { k: "closed", t: "영업 종료" };

              [37.4905, 126.9822],
            ],
            at: [37.48, 126.9826],
          },
          {
            name: "사당로",
            w: 11,
            pts: [
              [37.4852, 126.966],
              [37.4847, 126.971],
              [37.484, 126.975],
              [37.4838, 126.9784],
              [37.4842, 126.98],
              [37.485, 126.9818],
            ],
            at: [37.4833, 126.9752],
          },
          {
            name: "방배로",
            w: 9,
            pts: [
              [37.485, 126.9818],
              [37.4848, 126.985],
              [37.4846, 126.989],
            ],
            at: [37.4841, 126.9868],
          },
        ].forEach((r) => {
          L.polyline(r.pts, {
            color: edge,
            weight: r.w + 3,
            interactive: false,
            lineCap: "round",
          }).addTo(g);
          L.polyline(r.pts, {
            color: road,
            weight: r.w,
            interactive: false,
            lineCap: "round",
          }).addTo(g);
          L.marker(r.at, {
            interactive: false,
            keyboard: false,
            icon: L.divIcon({
              className: "road-label",
              html: r.name,
              iconSize: [60, 14],
              iconAnchor: [30, 7],
            }),
          }).addTo(g);
        });
        [
          ["이수역", 37.4862, 126.9818],
          ["사당역", 37.4765, 126.9816],
          ["남성역", 37.4846, 126.971],
        ].forEach(([n, la, ln]) => {
          L.marker([la, ln], {
            interactive: false,
            keyboard: false,
            zIndexOffset: -500,
            icon: L.divIcon({
              className: "",
              html: `<span class="stn">${n}</span>`,
              iconSize: [0, 0],
            }),
          }).addTo(g);
        });
        return g;
      }

      function sketch() {
        if (sketchOn) return;
        sketchOn = true;
        if (map.hasLayer(tiles)) map.removeLayer(tiles);
        layerCtl.getContainer().hidden = true;
        mapEl.classList.add("sketch");
        tilenote.hidden = false;
        if (!sketchLayer) sketchLayer = buildSketch();
        sketchLayer.addTo(map);
        sketchBtn.textContent = "실제 지도로 보기";
        sketchBtn.setAttribute("aria-pressed", "true");
      }
      function unsketch() {
        if (!sketchOn) return;
        sketchOn = false;
        if (sketchLayer) map.removeLayer(sketchLayer);
        mapEl.classList.remove("sketch");
        tilenote.hidden = true;
        tiles.addTo(map);
        layerCtl.getContainer().hidden = false;
        sketchBtn.textContent = "간이 약도로 보기";
        sketchBtn.setAttribute("aria-pressed", "false");
      }
      // 타일 서버가 또 에러 이미지를 정상 응답으로 줄 때를 대비한 수동 전환
      sketchBtn.onclick = () => {
        sketchOn ? unsketch() : sketch();
      };

      const WALK_R = Math.round((10 * 75) / 1.3); // 도보 10분 ≈ 577m
      L.circle([OFFICE.lat, OFFICE.lng], {
        radius: WALK_R,
        color: cssv("--accent") || "#1f6b4c",
        weight: 1.5,
        dashArray: "5 6",
        fill: false,
        interactive: false,
      }).addTo(map);
      L.marker([OFFICE.lat, OFFICE.lng], {
        icon: L.divIcon({
          className: "",
          html: '<div class="office">회사</div>',
          iconSize: [34, 34],
          iconAnchor: [17, 17],
        }),
        zIndexOffset: 1000,
      })
        .addTo(map)
        .bindPopup(
          '<div class="pop"><h3>한국소프트웨어서비스</h3><p>사당로 276 성보빌딩</p><p style="color:var(--muted)">점선 원 = 도보 약 10분 (577m)</p></div>',
        );

      const pinIcon = (r, big) =>
        L.divIcon({
          className: "",
          html: `<div class="pin${big ? " big" : ""}" style="background:${CATS[r.c]}"><span>${CAT_SHORT[r.c]}</span></div>`,
          iconSize: big ? [38, 38] : [28, 28],
          iconAnchor: big ? [19, 38] : [14, 28],
          popupAnchor: [0, big ? -36 : -26],
        });

      function popupHtml(r) {
        const st = status(r),
          q = encodeURIComponent(r.n.replace(/\s*\(.*\)/, "") + " 사당");
        return `<div class="pop"><h3>${r.n}</h3>
    <p>${r.c} · ${r.menu}</p>
    <p>${r.note}</p>
    <p><span class="state ${st.k}">${st.t}</span> · 도보 약 ${r.walk}분 (${r.d}m)</p>
    <p><span class="bud ${r.b}">${BUDGET_TXT[r.b]}</span> <span style="color:var(--muted)">(인당 12,000원 기준 추정)</span></p>
    ${r.tel ? `<p>전화 <span style="user-select:all">${r.tel}</span></p>` : ""}
    <div class="links">
      <a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버지도</a>
      <a href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">카카오맵</a>
    </div></div>`;
      }

      const markers = {};
      R.forEach((r) => {
        markers[r.id] = L.marker([r.lat, r.lng], {
          icon: pinIcon(r, false),
        }).bindPopup(popupHtml(r), { maxWidth: 260 });
        markers[r.id].on("click", () => select(r.id, false));
      });

      // 필터
      let cat = "전체",
        openOnly = false,
        budgetOnly = true,
        maxWalk = 10,
        activeId = null,
        pickedId = null;
      const walkset = document.getElementById("walkset");
      [
        [5, "5분"],
        [7, "7분"],
        [10, "10분"],
        [99, "전체"],
      ].forEach(([v, t]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip sm";
        b.textContent = v === 99 ? t : `${t} 이내`;
        b.setAttribute("aria-pressed", v === maxWalk);
        b.onclick = () => {
          maxWalk = v;
          walkset
            .querySelectorAll(".chip")
            .forEach((x) => x.setAttribute("aria-pressed", x === b));
          render();
          fitVisible();
        };
        walkset.appendChild(b);
      });
      document.getElementById("budgetOnly").onchange = (e) => {
        budgetOnly = e.target.checked;
        render();
      };
      const chips = document.getElementById("chips");
      ["전체", ...Object.keys(CATS)].forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = c;
        b.setAttribute("aria-pressed", c === cat);
        b.onclick = () => {
          cat = c;
          chips
            .querySelectorAll(".chip")
            .forEach((x) => x.setAttribute("aria-pressed", x === b));
          render();
        };
        chips.appendChild(b);
      });
      document.getElementById("openOnly").onchange = (e) => {
        openOnly = e.target.checked;
        render();
      };

      function visible() {
        return R.filter(
          (r) =>
            (cat === "전체" || r.c === cat) &&
            (!openOnly || status(r).k === "open") &&
            (!budgetOnly || r.b !== "over") &&
            r.walk <= maxWalk,
        );
      }

      function render() {
        const v = visible(),
          ids = new Set(v.map((r) => r.id));
        R.forEach((r) => {
          const m = markers[r.id];
          if (ids.has(r.id)) {
            if (!map.hasLayer(m)) m.addTo(map);
          } else if (map.hasLayer(m)) map.removeLayer(m);
        });
        document.getElementById("count").textContent =
          `${v.length}곳 · 가까운 순`;
        const list = document.getElementById("list");
        list.innerHTML = "";
        if (!v.length) {
          list.innerHTML =
            '<div class="count" style="padding:12px 2px">조건에 맞는 곳이 없어. 필터를 풀어봐.</div>';
          return;
        }
        v.forEach((r) => {
          const st = status(r);
          const el = document.createElement("button");
          el.type = "button";
          el.className =
            "item" +
            (r.id === activeId ? " active" : "") +
            (r.id === pickedId ? " picked" : "");
          el.dataset.id = r.id;
          el.innerHTML = `<div class="dot" style="background:${CATS[r.c]}">${CAT_SHORT[r.c]}</div>
      <div style="min-width:0"><div class="name">${r.n}</div>
      <div class="meta"><span>${r.menu}</span><span class="state ${st.k}">${st.t}</span><span class="bud ${r.b}">${BUDGET_TXT[r.b]}</span></div></div>
      <div class="walk">${r.walk}분<small>${r.d}m</small></div>`;
          el.onclick = () => select(r.id, true);
          list.appendChild(el);
        });
      }

      function select(id, fly) {
        activeId = id;
        const r = R.find((x) => x.id === id);
        if (fly)
          map.flyTo([r.lat, r.lng], 17, {
            duration: matchMedia("(prefers-reduced-motion:reduce)").matches
              ? 0
              : 0.6,
          });
        markers[id].openPopup();
        document
          .querySelectorAll(".item")
          .forEach((e) => e.classList.toggle("active", +e.dataset.id === id));
        const el = document.querySelector(`.item[data-id="${id}"]`);
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      // 랜덤 추천: 지금 영업중(또는 정보 없음)인 곳 중에서
      document.getElementById("pick").onclick = () => {
        let pool = visible().filter((r) => status(r).k !== "closed");
        if (!pool.length) pool = visible();
        if (!pool.length) return;
        const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
        const final = pool[Math.floor(Math.random() * pool.length)];
        let i = 0,
          steps = reduce ? 0 : 12;
        const btn = document.getElementById("pick");
        btn.disabled = true;
        const tick = () => {
          if (i < steps) {
            const r = pool[Math.floor(Math.random() * pool.length)];
            btn.textContent = r.n;
            i++;
            setTimeout(tick, 60 + i * 12);
            return;
          }
          if (pickedId != null && markers[pickedId])
            markers[pickedId].setIcon(
              pinIcon(
                R.find((x) => x.id === pickedId),
                false,
              ),
            );
          pickedId = final.id;
          markers[final.id].setIcon(pinIcon(final, true));
          render();
          select(final.id, true);
          btn.textContent = "다시 골라줘";
          btn.disabled = false;
        };
        tick();
      };

      function fitVisible() {
        const v = visible();
        if (!v.length) return;
        const b = L.latLngBounds(
          v.map((r) => [r.lat, r.lng]).concat([[OFFICE.lat, OFFICE.lng]]),
        );
        map.fitBounds(b, { padding: [30, 30], maxZoom: 17 });
      }
      render();
      fitVisible();
      setInterval(render, 60000);
    </script>
  </body>
</html>

    <style>
      :root {
        --bg: #eef1ea;
        --card: #fbfcf8;
        --ink: #1c2420;
        --muted: #5f6b63;
        --line: #d5dbd0;
        --accent: #1f6b4c;
        --accent-ink: #ffffff;
        --pick: #f0b93a;
        --pick-ink: #2a2006;
        --open: #2f8a57;
        --closed: #b5452f;
        --unknown: #8a8f86;
        --display:
          "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --body:
          "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121815;
          --card: #1a221e;
          --ink: #e7ece6;
          --muted: #9aa69e;
          --line: #2c3731;
          --accent: #5cc493;
          --accent-ink: #0d1a13;
          --open: #5cc493;
          --closed: #ec7a5f;
          --unknown: #8a948d;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.5;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        padding: 18px max(16px, env(safe-area-inset-left, 0px)) 32px
          max(16px, env(safe-area-inset-right, 0px));
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 2rem;
        line-height: 1;
        margin: 0;
      }
      .sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 4px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .chip {
        font: 500 0.85rem var(--body);
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .chip.sm {
        font-size: 0.78rem;
        padding: 3px 9px;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .walkset {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
        border-radius: 6px;
      }
      .toggle input {
        accent-color: var(--accent);
      }
      .chip:focus-visible,
      .pickbtn:focus-visible,
      label:focus-within,
      .shopinfo a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 8px;
      }
      .printer-wrap {
        width: min(320px, 100%);
      }
      .printer {
        height: 16px;
        border-radius: 8px;
        background: #2b332f;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        position: relative;
        z-index: 2;
      }
      .slot {
        overflow: hidden;
        padding-bottom: 14px;
        margin-top: -4px;
        min-height: 40px;
      }
      .receipt {
        --p: #fbfaf4;
        position: relative;
        background: var(--p);
        color: #23282a;
        padding: 18px 20px 22px;
        font-family:
          ui-monospace, "D2Coding", "Courier New", var(--body), monospace;
        font-size: 0.85rem;
        line-height: 1.55;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      }
      .receipt::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -10px;
        height: 10px;
        background:
          linear-gradient(-135deg, var(--p) 5px, transparent 0) 0 5px / 10px
            10px repeat-x,
          linear-gradient(135deg, var(--p) 5px, transparent 0) 0 5px / 10px
            10px repeat-x;
      }
      .receipt.printing {
        animation: rprint 1.4s steps(18, end) both;
      }
      @keyframes rprint {
        from {
          transform: translateY(-100%);
        }
        to {
          transform: none;
        }
      }
      .receipt hr {
        border: 0;
        border-top: 1px dashed #8d9390;
        margin: 8px 0;
      }
      .r-title {
        font-family: var(--display);
        font-size: 1.45rem;
        text-align: center;
        line-height: 1.2;
      }
      .r-center {
        text-align: center;
      }
      .r-sm {
        font-size: 0.78rem;
      }
      .r-dim {
        color: #6b726f;
        margin-top: 4px;
      }
      .r-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .r-head {
        color: #6b726f;
      }
      .r-item {
        font-family: var(--display);
        font-size: 1.75rem;
        line-height: 1.25;
        margin: 6px 0 4px;
        align-items: baseline;
      }
      .r-item span:first-child {
        word-break: keep-all;
      }
      .r-bar {
        height: 36px;
        margin-top: 12px;
        background: repeating-linear-gradient(
          90deg,
          #23282a 0 2px,
          transparent 2px 4px,
          #23282a 4px 5px,
          transparent 5px 8px,
          #23282a 8px 11px,
          transparent 11px 13px
        );
      }
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        padding: 6px 0;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }
      .pickbtn {
        font-family: var(--display);
        font-size: 1.25rem;
        border: 0;
        border-radius: 999px;
        padding: 12px 26px;
        background: var(--pick);
        color: var(--pick-ink);
        cursor: pointer;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      }
      .pickbtn:active {
        transform: translateY(1px);
        box-shadow: none;
      }
      .pickbtn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .shopinfo {
        width: min(320px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.85rem;
      }
      .shopinfo b {
        font-size: 1rem;
      }
      .shopinfo p {
        margin: 2px 0;
      }
      .shopinfo .links {
        display: flex;
        gap: 12px;
        margin-top: 6px;
      }
      .shopinfo a {
        color: var(--accent);
        font-weight: 700;
      }
      .state.open {
        color: var(--open);
      }
      .state.closed {
        color: var(--closed);
      }
      .state.unknown {
        color: var(--unknown);
      }
      .count {
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .receipt.printing {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>점심 영수증</h1>
        <div class="sub">
          한국소프트웨어서비스 · 사당로 276 성보빌딩 · 가게 이름 없이 오늘의
          메뉴만 뽑아줘
        </div>
      </header>

      <div class="controls" id="chips" role="group" aria-label="음식 종류"></div>
      <div class="controls">
        <span class="walkset" id="walkset" role="group" aria-label="도보 시간"></span>
        <label class="toggle"
          ><input type="checkbox" id="budgetOnly" checked /> 12,000원
          안쪽만</label
        >
        <label class="toggle"
          ><input type="checkbox" id="openOnly" /> 지금 영업중만</label
        >
      </div>

      <main class="stage">
        <div class="printer-wrap">
          <div class="printer" aria-hidden="true"></div>
          <div class="slot" id="slot" aria-live="polite">
            <div class="receipt" id="receipt" hidden>
              <div class="r-title">점심 영수증</div>
              <div class="r-center r-sm">사당로 276 성보빌딩</div>
              <hr />
              <div class="r-row r-sm"><span>일시</span><span id="rTime"></span></div>
              <div class="r-row r-sm"><span>주문번호</span><span id="rNo"></span></div>
              <hr />
              <div class="r-row r-sm r-head"><span>품목</span><span>수량</span></div>
              <div class="r-row r-item"><span id="rMenu"></span><span>1</span></div>
              <div class="r-row r-sm"><span>분류</span><span id="rCat"></span></div>
              <hr />
              <div class="r-center r-sm">오늘의 추천 메뉴입니다</div>
              <div class="r-center r-sm">맛있게 드세요 :)</div>
              <div class="r-center r-sm r-dim">※ 교환·환불 불가 (이미 정해진 점심)</div>
              <div class="r-bar" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="pickbtn" id="pick" type="button">영수증 뽑기</button>
          <button class="chip" id="shop" type="button" hidden>가게 보기</button>
        </div>
        <div class="shopinfo" id="shopinfo" hidden></div>
        <div class="count" id="count"></div>
      </main>
    </div>

          Rr = 6371000;
        const dLat = toR(b.lat - a.lat),
          dLng = toR(b.lng - a.lng);
        const s =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * Rr * Math.asin(Math.sqrt(s));
      }
      R.forEach((r, i) => {
        r.id = i;
        r.d = Math.round(dist(OFFICE, r));
        r.walk = Math.max(1, Math.round((r.d * 1.3) / 75));
      });
      R.sort((a, b) => a.d - b.d);

      const toMin = (t) => {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + m;
      };
      function status(r, now = new Date()) {
        if (!r.h) return { k: "unknown", t: "영업시간 확인 필요" };
        const s = r.h[now.getDay()];
        if (s === "휴무") return { k: "closed", t: "오늘 휴무" };
        if (s === "24h") return { k: "open", t: "24시간 영업" };
        // "11:30-15:00,16:30-20:30" 처럼 브레이크타임 있는 경우도 처리
        const cur = now.getHours() * 60 + now.getMinutes();
        const ranges = s.split(",").map((x) => x.split("-"));
        for (const [a, b] of ranges) {
          if (cur >= toMin(a) && cur < toMin(b))
            return {
              k: "open",
              t: `영업중 · ${b > "24" ? String((toMin(b) / 60 - 24) | 0).padStart(2, "0") + b.slice(2) : b}까지`,
            };
        }
        const next = ranges.find(([a]) => cur < toMin(a));
        if (next)
          return {
            k: "closed",
            t:
              ranges[0][0] === next[0]
                ? `${next[0]} 오픈`
                : `브레이크 · ${next[0]} 재오픈`,
          };
        return { k: "closed", t: "영업 종료" };
      }


      // ---- 영수증 UI ----
      let cat = "전체",
        openOnly = false,
        budgetOnly = true,
        maxWalk = 10,
        lastMenu = null,
        current = null,
        busy = false;

      const $ = (id) => document.getElementById(id);
      const receiptEl = $("receipt"),
        pickBtn = $("pick"),
        shopBtn = $("shop"),
        shopInfo = $("shopinfo");

      function visible() {
        return R.filter(
          (r) =>
            (cat === "전체" || r.c === cat) &&
            (!openOnly || status(r).k === "open") &&
            (!budgetOnly || r.b !== "over") &&
            r.walk <= maxWalk,
        );
      }
      function updateCount() {
        $("count").textContent = `조건에 맞는 가게 ${visible().length}곳에서 뽑아요`;
      }

      // 필터
      const chips = $("chips");
      ["전체", ...Object.keys(CATS)].forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = c;
        b.setAttribute("aria-pressed", c === cat);
        b.onclick = () => {
          cat = c;
          chips
            .querySelectorAll(".chip")
            .forEach((x) => x.setAttribute("aria-pressed", x === b));
          updateCount();
        };
        chips.appendChild(b);
      });
      const walkset = $("walkset");
      [
        [5, "5분 이내"],
        [7, "7분 이내"],
        [10, "10분 이내"],
        [99, "전체"],
      ].forEach(([v, t]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip sm";
        b.textContent = t;
        b.setAttribute("aria-pressed", v === maxWalk);
        b.onclick = () => {
          maxWalk = v;
          walkset
            .querySelectorAll(".chip")
            .forEach((x) => x.setAttribute("aria-pressed", x === b));
          updateCount();
        };
        walkset.appendChild(b);
      });
      $("budgetOnly").onchange = (e) => {
        budgetOnly = e.target.checked;
        updateCount();
      };
      $("openOnly").onchange = (e) => {
        openOnly = e.target.checked;
        updateCount();
      };

      // 메뉴 문구에서 품목 하나 뽑기
      const menuItems = (r) =>
        r.menu
          .split(",")
          .map((x) => x.replace(/\s*등\s.*$/, "").trim())
          .filter(Boolean);
      const two = (n) => String(n).padStart(2, "0");

      function printReceipt() {
        shopInfo.hidden = true;
        let pool = visible().filter((r) => status(r).k !== "closed");
        if (!pool.length) pool = visible();
        if (!pool.length) {
          current = null;
          shopBtn.hidden = true;
          receiptEl.hidden = true;
          shopInfo.hidden = false;
          shopInfo.innerHTML =
            '<p class="empty">조건에 맞는 곳이 없어. 필터를 풀어봐.</p>';
          return;
        }
        let r,
          item,
          tries = 0;
        do {
          r = pool[Math.floor(Math.random() * pool.length)];
          const items = menuItems(r);
          item = items[Math.floor(Math.random() * items.length)];
          tries++;
        } while (item === lastMenu && tries < 12);
        lastMenu = item;
        current = r;

        const d = new Date();
        $("rTime").textContent =
          `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;
        $("rNo").textContent = "No." + (Math.floor(Math.random() * 9000) + 1000);
        $("rMenu").textContent = item;
        $("rCat").textContent = r.c;

        receiptEl.hidden = false;
        receiptEl.classList.remove("printing");
        void receiptEl.offsetWidth;
        receiptEl.classList.add("printing");
        shopBtn.hidden = false;
        pickBtn.textContent = "다시 뽑기";
      }
      pickBtn.onclick = printReceipt;

      // 가게 보기: 눌렀을 때만 가게 이름 공개
      shopBtn.onclick = () => {
        const r = current;
        if (!r) return;
        const st = status(r),
          q = encodeURIComponent(r.n.replace(/\s*\(.*\)/, "") + " 사당");
        shopInfo.innerHTML = "";
        const box = document.createElement("div");
        box.innerHTML = `<p><b></b></p>
          <p class="meta1"></p>
          <p><span class="state ${st.k}">${st.t}</span> · 도보 약 ${r.walk}분 (${r.d}m)</p>
          <p class="note"></p>
          <div class="links">
            <a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버지도</a>
            <a href="https://map.kakao.com/?q=${q}" target="_blank" rel="noopener">카카오맵</a>
          </div>`;
        box.querySelector("b").textContent = r.n;
        box.querySelector(".meta1").textContent = `${r.c} · ${r.menu}`;
        box.querySelector(".note").textContent = r.note;
        shopInfo.appendChild(box);
        shopInfo.hidden = false;
      };

      updateCount();
      setInterval(updateCount, 60000);
    </script>
  </body>
</html>
